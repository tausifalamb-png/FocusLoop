name: Build BUYLORA AI Studio APK
on:
  workflow_dispatch:
  push:
    branches: [main, buylora-ai-studio]
    paths:
      - 'BUYLORA-AI-Studio/**'
      - '.github/workflows/build-buylora-ai-studio.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: BUYLORA-AI-Studio
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s BUYLORA-AI-Studio/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BUYLORA-AI-Studio-debug-apk
          path: BUYLORA-AI-Studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
