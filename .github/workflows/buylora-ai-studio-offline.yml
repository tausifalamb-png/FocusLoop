name: BUYLORA AI Studio Offline APK

on:
  push:
    branches:
      - buylora-ai-studio
    paths:
      - "BUYLORA-AI-Studio/**"
      - ".github/workflows/buylora-ai-studio-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: clean assembleDebug
          build-root-directory: BUYLORA-AI-Studio

      - name: Verify APK
        run: test -s BUYLORA-AI-Studio/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUYLORA-AI-Studio-zero-budget-debug-apk
          path: BUYLORA-AI-Studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
