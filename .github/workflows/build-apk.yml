name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract FocusLoop source
        run: |
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3LSC6wfWubV1soZQeKvBRe9bcCy/67d61d06-a6f3-4681-85db-18f5b555981e.zip" -o FocusLoop-source.zip
          unzip -o FocusLoop-source.zip
          test -f FocusLoop/gradlew
          chmod +x FocusLoop/gradlew

      - name: Fix Android style resource names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("FocusLoop/app/src/main/res")
          themes = base / "values/themes.xml"
          s = themes.read_text()
          s = s.replace('name="FL.Button"', 'name="FLButton"')
          s = s.replace('name="FL.Button.Primary"', 'name="FLButtonPrimary" parent="FLButton"')
          s = s.replace('name="FL.Button.Secondary"', 'name="FLButtonSecondary" parent="FLButton"')
          s = s.replace('name="FL.SectionTitle"', 'name="FLSectionTitle"')
          s = s.replace('name="FL.Card"', 'name="FLCard"')
          themes.write_text(s)
          for layout in base.rglob("*.xml"):
              t = layout.read_text()
              t = t.replace("@style/FL.Button.Primary", "@style/FLButtonPrimary")
              t = t.replace("@style/FL.Button.Secondary", "@style/FLButtonSecondary")
              t = t.replace("@style/FL.SectionTitle", "@style/FLSectionTitle")
              t = t.replace("@style/FL.Card", "@style/FLCard")
              layout.write_text(t)
          PY

      - name: Apply source audit fixes
        run: |
          python3 patches/patch_focusloop.py
          python3 patches/patch_p0_hardening.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: FocusLoop
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: FocusLoop
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FocusLoop-debug-apk
          path: FocusLoop/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
