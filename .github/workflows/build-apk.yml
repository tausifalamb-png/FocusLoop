name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract FocusLoop source
        run: |
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3LSC6wfWubV1soZQeKvBRe9bcCy/67d61d06-a6f3-4681-85db-18f5b555981e.zip" -o FocusLoop-source.zip
          unzip -o FocusLoop-source.zip
          test -f FocusLoop/gradlew
          chmod +x FocusLoop/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: FocusLoop
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FocusLoop-debug-apk
          path: FocusLoop/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
